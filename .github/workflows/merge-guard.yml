name: Merge Guard

# Turns on GitHub's native auto-merge for ordinary pull requests, and refuses to
# do so for anything that could reach .github/** — CI, workflow permissions and
# CODEOWNERS stay a human decision.
#
# Every check below fails closed: anything the job cannot positively verify
# blocks auto-merge rather than allowing it.
#
# Security posture: this runs on `pull_request_target`, so it executes in the
# context of the BASE branch with a write-capable token. That is only safe
# because it never touches the pull request's code:
#   - no checkout of any kind, so PR code never reaches the runner
#   - nothing from the PR is built, installed, or executed
#   - the only PR-derived data is the changed-path list, read from the API and
#     kept as JSON end to end, so an exotic filename is data and never syntax
on:
  pull_request_target:
    # `ready_for_review` is what re-evaluates a PR that started as a draft.
    types: [opened, synchronize, reopened, ready_for_review]

# Exactly what enabling auto-merge needs, and nothing more.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard and enable auto-merge
    runs-on: ubuntu-latest
    # Drafts are left alone; the ready_for_review trigger brings them back here.
    if: github.event.pull_request.draft == false

    steps:
      # No external actions are used, so there is nothing to pin to a SHA.
      - name: Check changed files and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Attacker-influenced values. They are read as data through the
          # environment and compared, never interpolated into this script.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          # 1. Forks never get auto-merge. A fork's head is outside this
          #    repository's review and ruleset guarantees, so it is a human's
          #    call regardless of which paths it touches. A deleted fork leaves
          #    HEAD_REPO empty, which lands here too.
          if [ "${HEAD_REPO:-}" != "${REPO}" ]; then
            echo "::error::Head repository is not ${REPO}; auto-merge is only ever enabled for branches in this repository."
            exit 1
          fi

          # 2. The files endpoint stops at 3000 entries. Past that the change
          #    cannot be inspected in full, so it does not qualify.
          if [ "${EXPECTED_FILES}" -gt 3000 ]; then
            echo "::error::This pull request changes ${EXPECTED_FILES} files, more than the files API will list. Every path must be verifiable."
            exit 1
          fi

          # One compact JSON object per line. Filenames stay JSON-encoded, so a
          # path containing quotes, spaces or newlines cannot break the parse.
          # A failure here (rate limit, transport error) trips `set -e` and
          # blocks, which is the direction we want.
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | {filename: .filename, previous_filename: (.previous_filename // null)}' \
            > files.jsonl

          # 3. The whole decision happens inside jq, over JSON values.
          #    `previous_filename` is checked as well, so moving a file OUT of
          #    .github/ is caught even though its new path looks innocent.
          verdict=$(jq -s --argjson expected "${EXPECTED_FILES}" '
            def touches_github:
              . != null and (ascii_downcase | test("^\\.github(/|$)"));
            {
              seen: length,
              expected: $expected,
              offenders: [
                .[] | select((.filename | touches_github)
                          or (.previous_filename | touches_github))
              ]
            }
          ' files.jsonl)

          seen=$(jq -r '.seen' <<<"${verdict}")
          offending=$(jq -r '.offenders | length' <<<"${verdict}")
          echo "Files inspected: ${seen} (pull request reports ${EXPECTED_FILES})"

          # 4. If the API did not hand back exactly what the pull request says it
          #    changed, some path went unexamined. Refuse rather than guess.
          if [ "${seen}" -ne "${EXPECTED_FILES}" ]; then
            echo "::error::Inspected ${seen} files but this pull request reports ${EXPECTED_FILES}; not every change could be verified."
            exit 1
          fi

          if [ "${offending}" -ne 0 ]; then
            echo "::error::This pull request touches .github/** — auto-merge will not be enabled. Merge it by hand after review."
            echo 'Offending entries (JSON-encoded):'
            # Printing JSON keeps a crafted path on one line and quoted; the
            # substitution additionally defuses workflow commands.
            jq -c '.offenders[]' <<<"${verdict}" | sed 's/::/;;/g'
            exit 1
          fi

          echo 'No .github/** changes; enabling auto-merge.'
          gh pr merge --auto --squash --repo "${REPO}" "${PR_NUMBER}"
