name: Deploy Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publishes only an artifact authorized by the protected central workflow.
    uses: mukkii-game/ai-dev-infra/.github/workflows/deploy-pages.yml@v2
